# JitPack builds the Android SDK, which lives in the android/ subfolder of this
# monorepo. Coordinates: com.github.Cross-Indie.sdks:crossindie[-compose]:<tag>
jdk:
  - openjdk17
install:
  - cd android && chmod +x gradlew && ./gradlew :crossindie:publishToMavenLocal :crossindie-compose:publishToMavenLocal -x test --no-daemon
