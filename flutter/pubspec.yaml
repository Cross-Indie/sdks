name: crossindie
description: >-
  Free cross-promotion banner for indie apps and games (CrossIndie network).
  Show other indies' banners, earn credits, spend them to get discovered.
version: 1.0.0
homepage: https://crossindie.com
repository: https://github.com/Cross-Indie/sdks/tree/main/flutter
issue_tracker: https://github.com/Cross-Indie/sdks/issues
topics:
  - ads
  - cross-promotion
  - banner
  - indie

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=0.13.6 <2.0.0"
  url_launcher: ">=6.1.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=2.0.0 <7.0.0"
