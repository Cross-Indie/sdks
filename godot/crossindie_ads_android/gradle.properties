org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Versions the plugin is COMPILED against. Everything is compileOnly: at
# export time Godot's Gradle build pulls the real play-services-ads version
# chosen by the editor export plugin (see addons/crossindie_ads/plugin.gd).
# Compiling against the OLDEST supported SDK keeps the AAR binary-compatible
# with every newer one; CI-style check: ./gradlew assembleRelease -PgmaVersion=25.5.0
godotVersion=4.2.0.stable
gmaVersion=22.6.0
